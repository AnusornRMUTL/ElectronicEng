<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Engineering: Semiconductor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn">⬅ กลับหน้าหลัก</a>
        <div class="logo">⚛️ Semiconductor Interactive Learning</div>
    </header>
    <div class="app-container">
        <aside id="sidebar">
            <!-- Navigation will be generated by JS -->
        </aside>
        
        <main>
            <div class="card" id="info-card">
                <h1 id="topic-title">Topic Title</h1>
                <p id="topic-desc">Description goes here...</p>
            </div>

            <div class="card simulator-card">
                <h2>ภาพจำลองการทำงาน (Interactive Animation)</h2>
                <div class="simulator-controls" id="sim-controls">
                    <!-- Dynamic controls (play/pause/interact) -->
                </div>
                <div class="simulator-canvas">
                    <svg viewBox="0 0 600 400" id="anim-svg">
                        <defs>
                            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="3" result="blur" />
                                <feMerge>
                                    <feMergeNode in="blur" />
                                    <feMergeNode in="SourceGraphic" />
                                </feMerge>
                            </filter>
                            <radialGradient id="atom-grad" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#60a5fa" />
                                <stop offset="100%" stop-color="#1e3a8a" />
                            </radialGradient>
                            <radialGradient id="dopant-n-grad" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#4ade80" />
                                <stop offset="100%" stop-color="#14532d" />
                            </radialGradient>
                            <radialGradient id="dopant-p-grad" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#f87171" />
                                <stop offset="100%" stop-color="#7f1d1d" />
                            </radialGradient>
                        </defs>
                        <!-- Dynamic SVG Content -->
                        <g id="svg-container"></g>
                    </svg>
                </div>
            </div>

            <div class="card" id="extra-info-card">
                <h2>เกร็ดความรู้เพิ่มเติม (Key Takeaways)</h2>
                <div id="topic-extra" class="example-text"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
