<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไดโอด (Diode) — ENGEE160 Electronics</title>
    <meta name="description" content="บทเรียนไดโอดแบบอินเทอร์แอคทีฟ: รอยต่อ P-N, I-V Curve, วงจรเรียงกระแส, Clipper, Clamper, Zener Diode">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn">⬅ กลับหน้าหลัก</a>
        <div class="logo">⚡ Diode Interactive Learning — ENGEE160</div>
    </header>

    <div class="app-container">
        <aside id="sidebar">
            <div class="sidebar-label">📚 หัวข้อบทเรียน</div>
            <!-- Navigation injected by JS -->
        </aside>

        <main>
            <!-- Title Card -->
            <div class="card" id="info-card">
                <h1 id="topic-title">หัวข้อบทเรียน</h1>
                <p class="desc-text" id="topic-desc"></p>
            </div>

            <!-- Simulator Card -->
            <div class="simulator-card" id="sim-card">
                <div class="sim-header">
                    <div class="sim-dot red"></div>
                    <div class="sim-dot yellow"></div>
                    <div class="sim-dot green"></div>
                    &nbsp; ภาพจำลองการทำงาน (Interactive Simulation)
                </div>
                <div class="simulator-controls" id="sim-controls"></div>
                <div class="simulator-canvas">
                    <svg viewBox="0 0 600 350" id="anim-svg" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="3" result="blur"/>
                                <feMerge>
                                    <feMergeNode in="blur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <g id="svg-container"></g>
                    </svg>
                </div>
            </div>

            <!-- Extra Info Card -->
            <div class="extra-card" id="extra-info-card">
                <div id="topic-extra"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
